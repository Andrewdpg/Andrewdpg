<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Andrés Parra — Software Engineer">
  <defs>
    <text id="nameText" x="42" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.4">Andrés Parra</text>

    <linearGradient id="nameGrad" x1="44" y1="92" x2="430" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8C2F8"/>
      <stop offset="0.45" stop-color="#9B76D3"/>
      <stop offset="1" stop-color="#6F4BAE"/>
    </linearGradient>

    <linearGradient id="shine" x1="-260" y1="0" x2="-120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-260;760;760" keyTimes="0;0.32;1" dur="9s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="x2" values="-120;900;900" keyTimes="0;0.32;1" dur="9s" repeatCount="indefinite" begin="1.2s"/>
    </linearGradient>

    <linearGradient id="rule" x1="44" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B76D3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9B76D3" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#9B76D3" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9B76D3" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="textGlow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="900" height="240" rx="18" fill="#171021" filter="url(#shadow)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="17.5" stroke="#9B76D3" stroke-opacity="0.26"/>

  <ellipse cx="820" cy="30" rx="280" ry="190" fill="url(#glow)">
    <animate attributeName="cx" values="820;740;820" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;70;30" dur="16s" repeatCount="indefinite"/>
  </ellipse>

  <text x="44" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="3.6" fill="#9B76D3">SOFTWARE ENGINEER · CALI, COLOMBIA</text>

  <use href="#nameText" fill="#9B76D3" opacity="0.55" filter="url(#textGlow)"/>
  <use href="#nameText" fill="url(#nameGrad)"/>
  <use href="#nameText" fill="url(#shine)"/>

  <line x1="44" y1="158" x2="560" y2="158" stroke="url(#rule)" stroke-width="1"/>
  <line x1="44" y1="158" x2="560" y2="158" stroke="#D9C6F7" stroke-width="1.4" stroke-dasharray="54 482" stroke-dashoffset="536" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="536;0" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.8;1" dur="6.5s" repeatCount="indefinite"/>
  </line>

  <text x="44" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#A79FBA">I build the parts nobody notices until they break.</text>

  <g stroke="#9B76D3" stroke-opacity="0.45" stroke-width="1.2">
    <line x1="676" y1="102" x2="736" y2="148"/>
    <line x1="750" y1="102" x2="750" y2="148"/>
    <line x1="824" y1="102" x2="764" y2="148"/>
  </g>

  <g fill="#D9C6F7">
    <circle r="2.2">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0s" path="M676,102 L736,148"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="2.2">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.9s" path="M750,102 L750,148"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle r="2.2">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="1.8s" path="M824,102 L764,148"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
  </g>

  <g stroke="#9B76D3" stroke-width="1.2">
    <rect x="650" y="70" width="52" height="32" rx="6" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="5s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="724" y="70" width="52" height="32" rx="6" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="5s" repeatCount="indefinite" begin="1.6s"/>
    </rect>
    <rect x="798" y="70" width="52" height="32" rx="6" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="5s" repeatCount="indefinite" begin="3.2s"/>
    </rect>
  </g>

  <rect x="724" y="148" width="52" height="32" rx="6" fill="#9B76D3" fill-opacity="0.22" stroke="#9B76D3" stroke-opacity="0.9" stroke-width="1.2">
    <animate attributeName="fill-opacity" values="0.16;0.42;0.16" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
